<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Prevención APPLY-NET</title>
<style>
:root{--azul:#23306b;--azul2:#3b4fa8;--fondo:#f2f4f9;--card:#fff;--texto:#18203a;--muted:#667089;--borde:#dde2ee;
--ok:#1e8e4f;--okbg:#e3f5ea;--mal:#c62828;--malbg:#fde7e7;--warn:#b26a00;--warnbg:#fff3dc;--radio:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fondo:#11141d;--card:#1b2030;--texto:#e8ebf4;--muted:#9aa3ba;--borde:#2c3348;--okbg:#14301f;--malbg:#3a1717;--warnbg:#382a10;--azul2:#7d8ff0}}
:root[data-theme="dark"]{--fondo:#11141d;--card:#1b2030;--texto:#e8ebf4;--muted:#9aa3ba;--borde:#2c3348;--okbg:#14301f;--malbg:#3a1717;--warnbg:#382a10;--azul2:#7d8ff0}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:0 16px 96px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:24px 4px 10px}
a{color:var(--azul2)}
.top{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;margin:0 -16px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top b{display:block;font-size:16px}.top small{opacity:.8;font-size:13px}.top .sp{flex:1;min-width:0}
.top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--borde);border-radius:var(--radio);padding:14px;margin-bottom:10px}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--borde);border-radius:var(--radio);padding:14px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.tile:disabled{opacity:.55;cursor:not-allowed}
.tile .ic{font-size:26px;width:40px;text-align:center}.tile .tx{flex:1;min-width:0}.tile .tx b{display:block}.tile .tx small{color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--borde);color:var(--texto);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.mal{background:var(--malbg);color:var(--mal)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.azul{background:#e4e8fb;color:var(--azul)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--borde);background:var(--card);color:var(--texto);border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--azul);border-color:var(--azul);color:#fff}:root[data-theme="dark"] .btn.primary{background:var(--azul2);border-color:var(--azul2)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--azul2);border-color:var(--azul2)}}.btn.big{width:100%;padding:16px;font-size:17px}.btn.sm{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;margin-bottom:12px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--borde);border-radius:10px;background:var(--card);color:var(--texto);margin-top:6px}
textarea{min-height:84px;resize:vertical}
.muted{color:var(--muted)}.small{font-size:13px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.brand{text-align:center;margin-bottom:20px}.logo img{width:100%;height:100%;object-fit:cover;display:block}.logo{overflow:hidden;width:64px;height:64px;border-radius:18px;background:var(--azul);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:22px}
.brand h1{margin:12px 0 2px;font-size:22px}
.sec{background:var(--card);border:1px solid var(--borde);border-radius:var(--radio);padding:14px;margin-bottom:12px}
.sec h3{margin:0 0 4px;font-size:16px;color:var(--azul2)}.sec .nota{font-size:13px;color:var(--muted);margin:0 0 10px}
.it{padding:10px 0;border-top:1px solid var(--borde)}.sec h3+.it,.sec .nota+.it{border-top:0}
.it .q{font-size:15px;margin-bottom:8px}.req{color:var(--mal);margin-left:3px}
.it.err{background:var(--malbg);margin:0 -14px;padding:10px 14px}.it.err .q::after{content:" · obligatorio";color:var(--mal);font-size:12px}
.it.alerta{background:var(--warnbg);margin:0 -14px;padding:10px 14px}
.seg{display:flex;gap:6px}.seg label{flex:1}.seg input{display:none}
.seg span{display:block;text-align:center;padding:11px 0;border:2px solid var(--borde);border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.seg input:checked+span{background:#16a34a;border-color:#0b6b2e;color:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.45);transform:scale(1.03)}
.seg input:checked+span::before{content:'✓ '}
.seg input[value=NO]:checked+span{background:#dc2626;border-color:#8f1414;box-shadow:0 0 0 3px rgba(220,38,38,.45)}
.seg input[value="N/A"]:checked+span{background:#2563eb;border-color:#173f99;box-shadow:0 0 0 3px rgba(37,99,235,.45)}
.seg input:not([value=SI]):not([value=NO]):not([value="N/A"]):checked+span{background:#2563eb;border-color:#173f99;box-shadow:0 0 0 3px rgba(37,99,235,.45)}
.seg span{transition:transform .08s}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:block}.chips input{display:none}
.chips span{display:block;padding:8px 12px;border:1px solid var(--borde);border-radius:999px;font-size:14px;cursor:pointer}
.chips input:checked+span{background:#2563eb;color:#fff;border-color:#173f99;box-shadow:0 0 0 3px rgba(37,99,235,.45)}
.chips input:checked+span::before{content:'✓ '}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.fotos div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--borde)}
.fotos img{width:100%;height:100%;object-fit:cover}.fotos button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff}
.firma canvas{width:100%;height:160px;border:1px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none;display:block}
.inv-h,.inv-f{display:grid;grid-template-columns:1fr 64px 64px;gap:6px;align-items:center}
.inv-h{font-size:11px;color:var(--muted);text-align:center;margin-bottom:4px}.inv-f{padding:6px 0;border-top:1px solid var(--borde)}
.inv-f input[data-k=item]{margin:0;padding:8px;font-size:14px}.inv-f .ck{display:flex;justify-content:center}.inv-f .ck input{display:none}
.inv-f .ck span{width:40px;height:34px;border-radius:10px;border:2px solid var(--borde);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--borde)}
.inv-f .ck input:checked+span{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.inv-f .ck.cambio input:checked+span{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.tabla .fila{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--borde)}
.tabla .fila [data-k=nombre],.tabla .fila [data-k=detalle],.tabla .fila .pick{grid-column:1/-1}
.tabla .fila input,.tabla .fila select{margin:0;padding:10px;font-size:14px}
.tabla .fila button{border:0;background:var(--malbg);color:var(--mal);border-radius:8px;font-size:18px}
.tabla.g .fila{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;background:var(--fondo);border:1px solid var(--borde);border-radius:12px;padding:10px;margin-bottom:10px}
.tabla.g .fila label{display:block;font-size:12px;font-weight:600;color:var(--muted)}.tabla.g .fila label.full{grid-column:1/-1}
.tabla.g .fila input,.tabla.g .fila select{margin-top:4px}
.tabla.g .gh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.tabla.g .gh button{width:auto;padding:6px 10px;font-size:13px}
.tabla.g .fila.pend{border-color:var(--warn);background:var(--warnbg)}
.totales{font-size:14px;line-height:1.6}
.info{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px;font-weight:700;text-align:center}
.geo{border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px;background:var(--warnbg);color:var(--warn)}
.geo.ok{background:var(--okbg);color:var(--ok)}.geo.bad{background:var(--malbg);color:var(--mal)}
.geo button{margin-left:6px;border:0;background:rgba(0,0,0,.08);border-radius:8px;padding:4px 10px;color:inherit;font:inherit}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px;margin-top:14px;display:flex;align-items:center;gap:10px}
.banner span{flex:1}
.list a{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--borde);text-decoration:none;color:inherit}
.list a:first-child{border-top:0}
.list a{align-items:center}.list a>span:first-child{min-width:0}
[hidden]{display:none!important}
.hint{color:var(--muted)}body.bg .hint{color:#dfe5fb}
.top.tt{padding:12px 16px 14px}.top .tema{display:grid;place-items:center;padding:8px 10px}.top .lg{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}.top .lg img{width:100%;height:100%;object-fit:cover;display:block}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1200;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--borde);padding:6px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.06)}
.tabbar button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;font-weight:600;color:var(--muted);position:relative;cursor:pointer;padding:5px 0;border-radius:12px}
.tabbar button.on{color:var(--azul2)}.tabbar button.on svg{stroke-width:2.3}
.tabbar .bd{position:absolute;top:0;left:calc(50% + 5px);font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px;color:#fff;background:var(--azul2)}.tabbar .bd.mal{background:#e5484d}.tabbar .bd.warn{background:#d98a00}
.prog{margin-top:14px}.prog .pt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.prog .pt span{font-weight:700;color:var(--azul2)}
.prog .pb{height:10px;border-radius:6px;background:var(--borde);overflow:hidden;margin-bottom:8px}.prog .pb i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#1e8e4f,#34c26f);transition:width .4s}
#toast{bottom:84px}
body.bg{background:#0a1030}
body.bg::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,10,40,.40),rgba(6,10,40,.85)),var(--fondo-img) 22% center/cover no-repeat}
body.bg .top{background:rgba(20,30,90,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.bg #app>h2,body.bg .brand h1,body.bg .brand .muted,body.bg .done h1,body.bg .done .muted,body.bg #fForm>p.muted{color:#e6ebff}
body.bg .login .logo{box-shadow:0 0 0 2px rgba(255,255,255,.5)}

.done{text-align:center;padding:40px 8px}.done .big{font-size:64px}
.alertbox{background:var(--malbg);color:var(--mal);border-radius:12px;padding:12px;text-align:left;margin:16px 0}
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.6);display:grid;place-items:center;z-index:50;color:#fff;text-align:center;padding:24px}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:g 1s linear infinite;margin:0 auto 12px}
.cargalogo{position:relative;width:96px;height:96px;margin:0 auto 14px}.cargalogo img{position:absolute;inset:5px;width:86px;height:86px;border-radius:50%;object-fit:cover}.cargalogo .spin{position:absolute;inset:0;width:96px;height:96px;margin:0;border-top-color:#F28C28;box-sizing:border-box}
@keyframes g{to{transform:rotate(360deg)}}
#toast{position:fixed;left:16px;right:16px;bottom:20px;max-width:600px;margin:0 auto;background:#18203a;color:#fff;padding:14px 16px;border-radius:12px;display:none;z-index:60;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--muted);font-weight:600}
</style>
<style>
.btn{transition:background .15s,color .15s,border-color .15s}.btn:not(.primary):not(:disabled):active{background:var(--azul);border-color:var(--azul);color:#fff}@media (hover:hover){.btn:not(.primary):not(:disabled):hover{background:var(--azul);border-color:var(--azul);color:#fff}}
.ap{display:flex;gap:8px;margin:6px 0 12px}.ap .btn{flex:1}.ap .btn.sel{background:var(--azul);border-color:var(--azul);color:#fff}
</style>
<style id="acento">
/* Acento naranjo */
.btn.primary,:root[data-theme="dark"] .btn.primary{background:#F28C28;border-color:#F28C28;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:#F28C28;border-color:#F28C28}}
.tabbar button.on{color:#F28C28}.top .lg{box-shadow:0 0 0 2px #F28C28}
.sec h3{color:#F28C28;border-left:4px solid #F28C28;padding-left:8px}
#app>h2{border-left:4px solid #F28C28;padding-left:8px;margin-left:0}
.prog .pt span{color:#F28C28}
input:focus,select:focus,textarea:focus{outline:2px solid #F28C28;outline-offset:0;border-color:#F28C28}
.tile:active{border-color:#F28C28}
.login .btn.primary,:root[data-theme] .login .btn.primary,:root:not([data-theme="light"]) .login .btn.primary{background:var(--azul);border-color:var(--azul);color:#fff} /*login-azul*/
.btn:not(.primary):not(:disabled):active{background:#F28C28;border-color:#F28C28;color:#fff}@media (hover:hover){.btn:not(.primary):not(:disabled):hover{background:#F28C28;border-color:#F28C28;color:#fff}}.ap .btn.sel{background:#F28C28;border-color:#F28C28}
</style>
